<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Réponses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .suggestion-button {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .suggestion-button:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>
    <h1>Posez votre question :</h1>
    <form id="question-form">
        <input type="text" id="question" name="question" required>
        <button type="submit">Envoyer</button>
    </form>

    <h2>Réponse :</h2>
    <div id="response"></div>

    <script>
        function sendQuestion(questionText) {
            fetch('/ask', {
                method: 'POST',
                body: new URLSearchParams('question=' + questionText),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            })
            .then(response => response.json())
            .then(data => {
                const responseDiv = document.getElementById('response');
                responseDiv.innerHTML = ''; // Nettoyer l'ancienne réponse

                if (data.answer.includes("Vouliez-vous dire")) {
                    // Suggestions proposées
                    const parts = data.answer.split("• ");
                    const intro = document.createElement("p");
                    intro.textContent = parts[0];
                    responseDiv.appendChild(intro);

                    parts.slice(1).forEach(suggestion => {
                        const btn = document.createElement("button");
                        btn.className = "suggestion-button";
                        btn.textContent = suggestion.trim();
                        btn.onclick = () => {
                            document.getElementById("question").value = suggestion.trim();
                            sendQuestion(suggestion.trim());
                        };
                        responseDiv.appendChild(btn);
                    });

                } else {
                    // Réponse directe
                    responseDiv.innerHTML = `<p>${data.answer}</p><small>Score : ${data.score}</small>`;
                }
            });
        }

        document.getElementById('question-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const question = document.getElementById('question').value;
            sendQuestion(question);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Réponses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        /* Loader style */
        .loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            display: none; /* Initially hidden */
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .suggestion-button {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .suggestion-button:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>
    <h1>Posez votre question :</h1>
    <form id="question-form">
        <input type="text" id="question" name="question" required>
        <button type="submit">Envoyer</button>
    </form>

    <!-- Loader element -->
    <div class="loader" id="loader"></div>

    <h2>Réponse :</h2>
    <div id="response"></div>

    <script>
        function sendQuestion(questionText) {
            // Show the loader
            document.getElementById('loader').style.display = 'block';
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = ''; // Clear any previous response

            fetch('/ask', {
                method: 'POST',
                body: new URLSearchParams('question=' + questionText),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            })
            .then(response => response.json())
            .then(data => {
                // Hide the loader
                document.getElementById('loader').style.display = 'none';

                responseDiv.innerHTML = ''; // Clear previous content

                if (data.answer.includes("Vouliez-vous dire")) {
                    // Suggestions proposed
                    const parts = data.answer.split("• ");
                    const intro = document.createElement("p");
                    intro.textContent = parts[0];
                    responseDiv.appendChild(intro);

                    parts.slice(1).forEach(suggestion => {
                        const btn = document.createElement("button");
                        btn.className = "suggestion-button";
                        btn.textContent = suggestion.trim();
                        btn.onclick = () => {
                            document.getElementById("question").value = suggestion.trim();
                            sendQuestion(suggestion.trim());
                        };
                        responseDiv.appendChild(btn);
                    });

                } else {
                    // Direct answer
                    responseDiv.innerHTML = `<p>${data.answer}</p><small>Score : ${data.score}</small>`;
                }
            })
            .catch(error => {
                // Hide the loader if an error occurs
                document.getElementById('loader').style.display = 'none';
                responseDiv.innerHTML = "<p>Error fetching answer. Please try again later.</p>";
            });
        }

        document.getElementById('question-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const question = document.getElementById('question').value;
            sendQuestion(question);
        });
    </script>
</body>
</html>
